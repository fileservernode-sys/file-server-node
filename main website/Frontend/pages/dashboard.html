<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Redirect | ZdexCloud</title>
  <meta http-equiv="refresh" content="0; url=servers.html">
  <link rel="canonical" href="https://zdexcloud.com/pages/servers.html">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <script src="../js/api-client.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    // Immediate script redirect to canonical servers & nodes page
    (async function() {
      try {
        const session = await AuthService.initSession();
        if (session && session.authenticated) {
          window.location.replace('servers.html' + window.location.search + window.location.hash);
        } else {
          window.location.replace('login.html?redirect=servers.html');
        }
      } catch (err) {
        window.location.replace('servers.html');
      }
    })();
  </script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--color-bg-primary, #F8FAFC); font-family: var(--font-family-sans, sans-serif);">
  <div style="text-align: center; padding: 2rem;">
    <div style="width: 48px; height: 48px; margin: 0 auto 1rem; border: 3px solid rgba(37, 99, 235, 0.2); border-top-color: #2563EB; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    <h1 style="font-size: 1.125rem; font-weight: 600; color: #1E293B; margin-bottom: 0.5rem;">Redirecting to Servers &amp; Nodes...</h1>
    <p style="font-size: 0.875rem; color: #64748B;">If you are not redirected automatically, <a href="servers.html" style="color: #2563EB; font-weight: 500;">click here to continue</a>.</p>
  </div>
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
