<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZdexCloud — Admin Operations Control Plane</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
  <div class="admin-app">
    <!-- Backdrop for mobile drawer -->
    <div id="adminDrawerBackdrop" class="admin-drawer-backdrop"></div>

    <!-- SIDEBAR -->
    <aside id="adminSidebar" class="admin-sidebar">
      <div class="admin-sidebar-header">
        <div class="admin-sidebar-brand">
          <div class="admin-brand-logo-wrap" style="width:32px;height:32px;margin-bottom:0;border-radius:6px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
              <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.8 17 5 19 5a1 1 0 0 1 1 1z"/>
            </svg>
          </div>
          <span>ZdexControl</span>
        </div>
        <div class="admin-env-badge prod" style="margin-top:0;font-size:0.6875rem;">
          <span class="admin-env-dot"></span> PROD
        </div>
      </div>

      <nav id="adminSidebarNav" class="admin-sidebar-nav">
        <!-- Dynamically rendered by admin-shell.js based on permissions -->
      </nav>

      <div class="admin-sidebar-footer">
        <div class="admin-sidebar-user">
          <div class="admin-avatar" id="adminAvatarInitials">AD</div>
          <div class="admin-user-info">
            <div class="admin-user-name" id="adminSidebarName">Loading...</div>
            <div class="admin-user-role" id="adminSidebarRole">ADMIN</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- MAIN WRAPPER -->
    <div class="admin-main-wrap">
      <!-- TOP HEADER -->
      <header class="admin-header">
        <div class="admin-header-left">
          <button id="adminMenuToggle" class="admin-btn-icon admin-menu-toggle" aria-label="Toggle navigation menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
              <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>
            </svg>
          </button>

          <div class="admin-breadcrumbs">
            <a href="#dashboard">Admin</a>
            <span class="admin-breadcrumb-separator">/</span>
            <span id="adminBreadcrumbGroup">Overview</span>
            <span class="admin-breadcrumb-separator">/</span>
            <span id="adminBreadcrumbCurrent" class="admin-breadcrumb-current">Dashboard</span>
          </div>
        </div>

        <div class="admin-header-right">
          <!-- Live Session Countdown Timer -->
          <div class="admin-session-timer" title="Session inactivity timeout countdown">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            <span id="adminSessionCountdown">15:00</span>
          </div>

          <!-- Profile Trigger & Popover -->
          <div class="admin-profile-menu-wrap">
            <button id="adminProfileBtn" class="admin-profile-btn" aria-label="User Profile and settings">
              <div class="admin-avatar" style="width:26px;height:26px;font-size:0.6875rem;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
                  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
              </div>
              <span id="adminHeaderName" style="font-size:0.8125rem;font-weight:600;">Admin</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;color:var(--admin-text-muted);">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>

            <div id="adminProfileDropdown" class="admin-profile-dropdown">
              <div class="admin-dropdown-header">
                <div id="adminDropdownName" style="font-weight:700;font-size:0.875rem;color:var(--admin-text-primary);">Admin</div>
                <div id="adminDropdownEmail" style="font-size:0.75rem;color:var(--admin-text-muted);font-family:var(--font-mono);">admin@zdexcloud.com</div>
                <div id="adminDropdownRoles" class="admin-dropdown-roles"></div>
              </div>

              <a href="#dashboard" class="admin-dropdown-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
                  <rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/>
                  <rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>
                </svg>
                <span>Dashboard</span>
              </a>

              <a href="#admin-roles" class="admin-dropdown-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
                  <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.8 17 5 19 5a1 1 0 0 1 1 1z"/>
                </svg>
                <span>My Permissions</span>
              </a>

              <button type="button" class="admin-dropdown-item danger" data-action="logout" style="border-top:1px solid var(--admin-border-subtle);margin-top:0.375rem;padding-top:0.625rem;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>
                </svg>
                <span>Sign Out</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- ACTIVE VIEW CONTAINER -->
      <main id="adminViewContainer" class="admin-content">
        <!-- Rendered dynamically by admin-shell.js -->
      </main>
    </div>
  </div>

  <script src="/admin/js/admin-api.js?v=2.0.3"></script>
  <script src="/admin/js/admin-auth.js?v=2.0.3"></script>
  <script src="/admin/js/admin-shell.js?v=2.0.3"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.AdminShell.init();
    });
  </script>
</body>
</html>
