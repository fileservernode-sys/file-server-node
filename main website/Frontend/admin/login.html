<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZdexCloud — Admin Control Plane Sign In</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="admin-login-body">
  <div class="admin-login-container">
    <div class="admin-login-card">
      <div class="admin-login-brand">
        <div class="admin-brand-logo-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:28px;height:28px;">
            <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.8 17 5 19 5a1 1 0 0 1 1 1z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <h1 class="admin-login-title">ZdexCloud Admin</h1>
        <p class="admin-login-subtitle">Production Operations Control Plane</p>
        <div class="admin-env-badge prod">
          <span class="admin-env-dot"></span>
          Restricted Access
        </div>
      </div>

      <div id="alertBanner" style="display: none;"></div>

      <!-- Step 1: Credentials Form -->
      <form id="loginForm" autocomplete="off">
        <div class="admin-form-group">
          <label class="admin-form-label" for="email">Admin Email Address</label>
          <div class="admin-input-wrap">
            <svg class="admin-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
              <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
            <input type="email" id="email" class="admin-input" placeholder="admin@zdexcloud.com" required autofocus>
          </div>
        </div>

        <div class="admin-form-group">
          <label class="admin-form-label" for="password">Password</label>
          <div class="admin-input-wrap">
            <svg class="admin-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="password" class="admin-input" placeholder="••••••••••••" required>
          </div>
        </div>

        <button type="submit" id="submitLoginBtn" class="admin-btn admin-btn-primary" style="margin-top: 1.5rem;">
          <span>Sign In to Control Plane</span>
        </button>
      </form>

      <!-- Step 2: 2FA OTP Challenge Form -->
      <form id="otpForm" style="display: none;" autocomplete="off">
        <div style="text-align:center;margin-bottom:1rem;">
          <p style="font-size:0.875rem;color:var(--admin-text-secondary);">
            Enter the 6-digit security code sent to:
          </p>
          <strong id="otpTargetEmail" style="font-size:0.9375rem;color:var(--admin-primary);font-family:var(--font-mono);"></strong>
        </div>

        <div class="otp-container">
          <input type="text" maxlength="1" class="otp-box" data-index="0" autofocus>
          <input type="text" maxlength="1" class="otp-box" data-index="1">
          <input type="text" maxlength="1" class="otp-box" data-index="2">
          <input type="text" maxlength="1" class="otp-box" data-index="3">
          <input type="text" maxlength="1" class="otp-box" data-index="4">
          <input type="text" maxlength="1" class="otp-box" data-index="5">
        </div>

        <button type="submit" id="submitOtpBtn" class="admin-btn admin-btn-primary">
          <span>Verify & Access Console</span>
        </button>

        <div class="admin-helper-text">
          <button type="button" id="backToLoginBtn" class="admin-btn admin-btn-secondary admin-btn-sm" style="margin-top:1rem;">
            ← Back to email sign in
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="/admin/js/admin-api.js"></script>
  <script src="/admin/js/admin-auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('loginForm');
      const otpForm = document.getElementById('otpForm');
      const alertBanner = document.getElementById('alertBanner');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const submitLoginBtn = document.getElementById('submitLoginBtn');
      const submitOtpBtn = document.getElementById('submitOtpBtn');
      const backToLoginBtn = document.getElementById('backToLoginBtn');
      const otpTargetEmail = document.getElementById('otpTargetEmail');
      const otpBoxes = Array.from(document.querySelectorAll('.otp-box'));

      let pendingEmail = '';

      // Check URL query parameters for notifications
      const urlParams = new URLSearchParams(window.location.search);
      const reason = urlParams.get('reason');
      if (reason === 'session_expired') {
        showAlert('Your administrative session has expired. Please sign in again.', 'warning');
      }

      // If already authenticated, redirect
      if (window.AdminAuth.isAuthenticated()) {
        window.location.href = '/admin/';
      }

      function showAlert(msg, type = 'danger') {
        alertBanner.className = `admin-alert admin-alert-${type}`;
        alertBanner.textContent = msg;
        alertBanner.style.display = 'block';
      }

      function hideAlert() {
        alertBanner.style.display = 'none';
        alertBanner.textContent = '';
      }

      function getRedirectDestination() {
        const raw = urlParams.get('redirect') || urlParams.get('return') || urlParams.get('returnTo') || urlParams.get('next') || urlParams.get('continue');
        if (window.AdminAuth && typeof window.AdminAuth.getSafeRedirect === 'function') {
          return window.AdminAuth.getSafeRedirect(raw, '/admin/');
        }
        // Self-contained fallback validator if AdminAuth is loading
        if (!raw || typeof raw !== 'string') return '/admin/';
        let t = raw.trim();
        if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(t) || t.startsWith('//') || t.startsWith('\\') || t.includes('@')) return '/admin/';
        if (/^\/admin(\/([a-zA-Z0-9_.-]+)?)?([?#].*)?$/.test(t)) return t;
        if (/^#([a-zA-Z0-9_\-\/]+)$/.test(t)) return '/admin/' + t;
        return '/admin/';
      }

      // Step 1: Login Submission
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showAlert('Please provide both email and password.');
          return;
        }

        submitLoginBtn.disabled = true;
        submitLoginBtn.innerHTML = '<span class="admin-spinner"></span> Authenticating...';

        try {
          const res = await window.AdminAuth.login(email, password);
          
          if (res.requiresOtp) {
            pendingEmail = res.email || email;
            otpTargetEmail.textContent = pendingEmail;
            loginForm.style.display = 'none';
            otpForm.style.display = 'block';
            showAlert('2FA security code required. Check your email.', 'info');
            setTimeout(() => otpBoxes[0].focus(), 100);
          } else {
            // Direct login success with safe redirect validation
            window.location.href = getRedirectDestination();
          }
        } catch (err) {
          showAlert(err.message || 'Authentication failed.');
        } finally {
          submitLoginBtn.disabled = false;
          submitLoginBtn.innerHTML = '<span>Sign In to Control Plane</span>';
        }
      });

      // OTP Input navigation & paste handling
      otpBoxes.forEach((box, idx) => {
        box.addEventListener('input', (e) => {
          const val = e.target.value;
          if (val.length === 1 && idx < otpBoxes.length - 1) {
            otpBoxes[idx + 1].focus();
          }
        });

        box.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !box.value && idx > 0) {
            otpBoxes[idx - 1].focus();
          }
        });

        box.addEventListener('paste', (e) => {
          e.preventDefault();
          const text = (e.clipboardData || window.clipboardData).getData('text').trim();
          if (/^\d{6}$/.test(text)) {
            text.split('').forEach((char, i) => {
              if (otpBoxes[i]) otpBoxes[i].value = char;
            });
            otpBoxes[5].focus();
          }
        });
      });

      // Step 2: OTP Verification
      otpForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const otpCode = otpBoxes.map(b => b.value).join('').trim();
        if (otpCode.length !== 6) {
          showAlert('Please enter the complete 6-digit verification code.');
          return;
        }

        submitOtpBtn.disabled = true;
        submitOtpBtn.innerHTML = '<span class="admin-spinner"></span> Verifying Security Code...';

        try {
          await window.AdminAuth.verifyOtp(pendingEmail, otpCode);
          window.location.href = getRedirectDestination();
        } catch (err) {
          showAlert(err.message || 'OTP verification failed. Please check the code.');
          otpBoxes.forEach(b => b.value = '');
          otpBoxes[0].focus();
        } finally {
          submitOtpBtn.disabled = false;
          submitOtpBtn.innerHTML = '<span>Verify & Access Console</span>';
        }
      });

      // Back button
      backToLoginBtn.addEventListener('click', () => {
        hideAlert();
        otpForm.style.display = 'none';
        loginForm.style.display = 'block';
        otpBoxes.forEach(b => b.value = '');
      });
    });
  </script>
</body>
</html>
