    <path d="M28 36C28 34.3431 29.3431 33 31 33H77C78.6569 33 80 34.3431 80 36C80 37.6569 78.6569 39 77 39H31C29.3431 39 28 37.6569 28 36Z" fill="#FFFFFF" />
