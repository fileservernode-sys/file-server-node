    <path d="M31 69C29.3431 69 28 70.3431 28 72C28 73.6569 29.3431 75 31 75H77C78.6569 75 80 73.6569 80 72C80 70.3431 78.6569 69 77 69H31Z" fill="#FFFFFF" />
    <circle cx="54" cy="54" r="8" fill="#93C5FD" stroke="#FFFFFF" stroke-width="4" />
  </g>

