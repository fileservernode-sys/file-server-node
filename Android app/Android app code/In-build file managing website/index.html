<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Manager | RemoteNode — Personal Android File Server</title>
  <meta name="description" content="Lightweight in-built file managing website running on your Android phone storage host.">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/file-manager.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Site Header -->
    <header class="site-header">
      <div class="header-inner">
        <div style="display: flex; align-items: center; gap: var(--space-sm);">
          <strong style="font-size: var(--font-size-lg); color: var(--color-brand-primary);">RN File Manager</strong>
          <span class="badge badge-online">
            <span class="status-dot"></span> LOCAL SERVER ONLINE
          </span>
        </div>
        <div style="display: flex; align-items: center; gap: var(--space-sm);">
          <span style="font-size: var(--font-size-xs); color: var(--color-text-muted);">Host: 127.0.0.1:8080</span>
          <button type="button" class="btn btn-secondary btn-sm" onclick="FileServerAuth.logout()">Sign Out</button>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      
      <!-- Toolbar Section -->
      <div class="toolbar-section">
        <div style="display: flex; gap: var(--space-xs); flex-wrap: wrap;">
          <button id="btn-new-folder" class="btn btn-primary">➕ New Folder</button>
          <button id="btn-upload" class="btn btn-secondary">📤 Upload File</button>
          <button id="btn-refresh" class="btn btn-secondary btn-icon" title="Refresh">🔄</button>
          <input type="file" id="file-picker" style="display: none;">
        </div>

        <div class="search-box">
          <input type="text" id="search-input" class="form-input" placeholder="🔍 Search files in folder...">
        </div>
      </div>

      <!-- Breadcrumb Navigation Bar -->
      <div id="breadcrumb-container" class="breadcrumb-bar">
        <span class="breadcrumb-item">Home</span>
      </div>

      <!-- Dynamic File List / Grid Container -->
      <div id="file-list-container">
        <!-- Rendered dynamically by file-manager.js -->
      </div>

    </main>
  </div>

  <!-- Create New Folder Modal -->
  <div id="modal-new-folder" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Create New Folder</h3>
        <button class="btn btn-secondary btn-sm" onclick="UIManager.hideModal('modal-new-folder')">✕</button>
      </div>
      <form id="form-new-folder">
        <div class="form-group">
          <label for="input-folder-name" class="form-label">Folder Name</label>
          <input type="text" id="input-folder-name" class="form-input" placeholder="e.g. Documents" required>
        </div>
        <div style="display: flex; gap: var(--space-xs); justify-content: flex-end;">
          <button type="button" class="btn btn-secondary" onclick="UIManager.hideModal('modal-new-folder')">Cancel</button>
          <button type="submit" class="btn btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Application Modules -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/file-manager.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
