name: Build & Release Flutter Applications (Android APK & iOS CI Foundation)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 1. BUILD ANDROID APK ARTIFACTS (PRIMARY PRODUCT TARGET)
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android APK (Release & Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd "Android app/Android app code"
          flutter pub get

      - name: Run Static Analysis
        run: |
          cd "Android app/Android app code"
          flutter analyze

      - name: Run Flutter Test Suite
        run: |
          cd "Android app/Android app code"
          flutter test

      - name: Build Android Debug APK
        run: |
          cd "Android app/Android app code"
          flutter build apk --debug

      - name: Build Android Release APK
        run: |
          cd "Android app/Android app code"
          flutter build apk --release

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: remote-node-android-apk
          path: |
            Android app/Android app code/build/app/outputs/flutter-apk/app-release.apk
            Android app/Android app code/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 2. FUTURE CROSS-PLATFORM CI FOUNDATION (IOS APP BUNDLE BUILD)
  # Note: iOS support is unreleased. Signing, provisioning, and distribution remain future work.
  # ---------------------------------------------------------------------------
  build-ios:
    name: Build iOS Bundle (Future Cross-Platform CI)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd "Android app/Android app code"
          flutter pub get

      - name: Build iOS Application (No Codesign)
        run: |
          cd "Android app/Android app code"
          flutter build ios --no-codesign

      - name: Compress iOS App Payload into Zip
        run: |
          cd "Android app/Android app code/build/ios/iphoneos"
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r remote-node-ios-app.zip Payload

      - name: Upload iOS App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-node-ios-app
          path: Android app/Android app code/build/ios/iphoneos/remote-node-ios-app.zip
          retention-days: 30
